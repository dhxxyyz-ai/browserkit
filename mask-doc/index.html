  <style>
    
    *{margin:0;padding:0;box-sizing:border-box;transition:all 0.2s ease;}
    body{color:var(--text);font-family:'Gowun Dodum',sans-serif;font-size:16px;line-height:1.6;min-height:100vh;}
    a{color:var(--point-hover);text-decoration:none;}
    .container{max-width:960px;margin:0 auto;padding:0 24px;}
    .header{padding:24px 0 16px;border-bottom:1px solid var(--border);}
    .header .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .logo-icon{font-size:24px;}.logo-text{font-size:20px;font-weight:700;font-family:'Gowun Dodum',sans-serif;background:linear-gradient(135deg,var(--point),var(--point-hover));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .back-link{font-size:13px;color:var(--subtext);}.back-link:hover{color:var(--text);}
    .hero{text-align:center;padding:40px 0 20px;}.hero-icon{font-size:48px;margin-bottom:16px;}
    .hero h1{font-size:32px;font-weight:700;margin-bottom:12px;background:linear-gradient(135deg,var(--point),var(--point-hover));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .hero p{color:var(--subtext);font-size:15px;margin-bottom:20px;}
    .badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-bottom:0;}
    .badge{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 16px;font-size:13px;color:var(--subtext);}
    /* 탐지 옵션 */
    .options-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px;}
    .option-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
    .option-card:hover{border-color:var(--point);}
    .option-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .option-title{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;}
    .option-icon{font-size:18px;}
    /* 토글 */
    .toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
    .toggle input{opacity:0;width:0;height:0;}
    .toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.15);border-radius:999px;}
    .toggle-slider:before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;}
    .toggle input:checked + .toggle-slider{background:var(--point);}
    .toggle input:checked + .toggle-slider:before{transform:translateX(20px);}
    /* 서브옵션 */
    .sub-options{display:flex;flex-direction:column;gap:6px;}
    .sub-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--subtext);cursor:pointer;}
    .sub-label input[type=radio]{accent-color:var(--point);cursor:pointer;}
    .sub-label:hover{color:var(--text);}
    /* 에디터 */
    .editor-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;}
    .editor-box{display:flex;flex-direction:column;gap:8px;}
    .editor-label{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--subtext);font-weight:600;}
    .editor-textarea{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;color:var(--text);font-size:14px;font-family:'Gowun Dodum',sans-serif;line-height:1.7;resize:none;min-height:320px;width:100%;}
    .editor-textarea:focus{outline:none;border-color:var(--point);}
    .editor-textarea::placeholder{color:var(--subtext);}
    .editor-info{font-size:12px;color:var(--subtext);font-family:'Gowun Dodum',sans-serif;}
    /* 탐지 요약 */
    .detect-summary{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
    .detect-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--subtext);}
    .detect-count{font-weight:700;color:var(--point-hover);font-family:'Gowun Dodum',sans-serif;}
    .detect-none{font-size:13px;color:var(--subtext);}
    /* 버튼 */
    .action-wrap{display:flex;justify-content:center;gap:12px;margin:0 0 48px;flex-wrap:wrap;}
    .btn-primary{background:linear-gradient(135deg,var(--point),var(--point-hover));color:white;border:none;border-radius:12px;padding:13px 28px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Gowun Dodum',sans-serif;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--glow);}
    .btn-primary:disabled{opacity:0.4;cursor:default;transform:none;box-shadow:none;}
    .btn-sub{background:var(--card);color:var(--subtext);border:1px solid var(--border);border-radius:12px;padding:13px 22px;font-size:15px;cursor:pointer;font-family:'Gowun Dodum',sans-serif;}
    .btn-sub:hover{transform:translateY(-2px);color:var(--text);border-color:var(--point);}
    .btn-sub:disabled{opacity:0.4;cursor:default;transform:none;}
    /* 토스트 */
    .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--success);color:#fff;border-radius:999px;padding:10px 24px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;z-index:999;}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
    /* 배너 */
    .adfit-wrap{text-align:center;margin:24px 0;}.adfit-pc{display:block;}    /* 푸터 */
    .footer{border-top:1px solid var(--border);padding:32px 0;text-align:center;}
    .footer-copy{color:var(--subtext);font-size:13px;margin-bottom:12px;}
    .footer-nav{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;}
    .footer-nav a{color:var(--subtext);font-size:13px;}.footer-nav a:hover{color:var(--text);}
    @media(max-width:640px){.options-grid{grid-template-columns:1fr;}.editor-wrap{grid-template-columns:1fr;}.hero h1{font-size:24px;}.coupang-banner-pc{display:none;}.coupang-banner-mo{display:block;}.adfit-pc{display:none;}.adfit-mo{display:block;}}

  <script>
  const inputText  = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
  const maskBtn    = document.getElementById('maskBtn');
  const copyBtn    = document.getElementById('copyBtn');
  const downloadBtn= document.getElementById('downloadBtn');
  const clearBtn   = document.getElementById('clearBtn');
  const inputInfo  = document.getElementById('inputInfo');
  const outputInfo = document.getElementById('outputInfo');
  const detectSummary = document.getElementById('detectSummary');

  // ── 토스트 ──
  function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

  // ── 옵션 getter ──
  const getRRN    = ()=>document.getElementById('toggleRRN').checked;
  const getPhone  = ()=>document.getElementById('togglePhone').checked;
  const getEmail  = ()=>document.getElementById('toggleEmail').checked;
  const getAccount= ()=>document.getElementById('toggleAccount').checked;
  const getRRNMode    = ()=>document.querySelector('input[name=rrnMode]:checked').value;
  const getPhoneMode  = ()=>document.querySelector('input[name=phoneMode]:checked').value;
  const getEmailMode  = ()=>document.querySelector('input[name=emailMode]:checked').value;
  const getAccountMode= ()=>document.querySelector('input[name=accountMode]:checked').value;

  // ── 정규식 패턴 ──
  const PAT_RRN     = /\d{6}-[1-4]\d{6}/g;
  const PAT_PHONE   = /(\+82-?|0)\d{1,2}-?\d{3,4}-?\d{4}/g;
  const PAT_EMAIL   = /[\w.+-]+@[\w-]+\.[\w.]+/g;
  const PAT_ACCOUNT = /\d{3,6}-\d{2,6}-\d{6,7}(-\d{2,3})?/g;

  // ── 마스킹 함수 ──
  function maskText(text){
    let counts = {rrn:0, phone:0, email:0, account:0};
    // 계좌번호 먼저 (주민번호와 겹칠 수 있음)
    if(getAccount()){
      text = text.replace(PAT_ACCOUNT, m=>{
        counts.account++;
        if(getAccountMode()==='full') return '●●●-●●●-●●●●●●';
        // back4: 마지막 4자리만 마스킹
        return m.replace(/\d{4}$/, '●●●●');
      });
    }
    if(getRRN()){
      text = text.replace(PAT_RRN, m=>{
        counts.rrn++;
        const [front,back] = m.split('-');
        if(getRRNMode()==='full')  return '●●●●●●-●●●●●●●';
        if(getRRNMode()==='back')  return front+'-●●●●●●●';
        if(getRRNMode()==='last6') return front+'-'+back[0]+'●●●●●●';
        return m;
      });
    }
    if(getPhone()){
      text = text.replace(PAT_PHONE, m=>{
        counts.phone++;
        const clean = m.replace(/\D/g,'');
        if(getPhoneMode()==='full')  return '●●●-●●●●-●●●●';
        if(getPhoneMode()==='back8'){
          // 앞 3자리 유지
          const pre = clean.length>=10 ? clean.slice(0,3) : clean.slice(0,2);
          return pre+'-●●●●-●●●●';
        }
        if(getPhoneMode()==='back4'){
          // 앞 7자리 유지 (010-1234)
          const parts = m.split('-');
          if(parts.length>=3) return parts[0]+'-'+parts[1]+'-●●●●';
          return m.slice(0,-4)+'●●●●';
        }
        return m;
      });
    }
    if(getEmail()){
      text = text.replace(PAT_EMAIL, m=>{
        counts.email++;
        if(getEmailMode()==='full') return '●●●@●●●.●●●';
        const [id,domain] = m.split('@');
        return '●●●@'+domain;
      });
    }
    return {text, counts};
  }

  // ── 탐지 미리보기 (입력 시 실시간) ──
  function previewDetect(text){
    const cnt = {rrn:0,phone:0,email:0,account:0};
    if(getAccount()) { const m=text.match(PAT_ACCOUNT); if(m) cnt.account=m.length; }
    if(getRRN())     { const m=text.match(PAT_RRN);     if(m) cnt.rrn=m.length; }
    if(getPhone())   { const m=text.match(PAT_PHONE);   if(m) cnt.phone=m.length; }
    if(getEmail())   { const m=text.match(PAT_EMAIL);   if(m) cnt.email=m.length; }
    const total = cnt.rrn+cnt.phone+cnt.email+cnt.account;
    if(total===0){
      detectSummary.innerHTML='<span class="detect-none">탐지된 개인정보가 없습니다.</span>';
    } else {
      let html='';
      if(cnt.rrn)     html+=`<span class="detect-item"><span class="option-icon">&#x1F194;</span> 주민번호 <span class="detect-count">${cnt.rrn}건</span></span>`;
      if(cnt.phone)   html+=`<span class="detect-item"><span class="option-icon">&#x1F4F1;</span> 전화번호 <span class="detect-count">${cnt.phone}건</span></span>`;
      if(cnt.email)   html+=`<span class="detect-item"><span class="option-icon">&#x1F4E7;</span> 이메일 <span class="detect-count">${cnt.email}건</span></span>`;
      if(cnt.account) html+=`<span class="detect-item"><span class="option-icon">&#x1F3E6;</span> 계좌번호 <span class="detect-count">${cnt.account}건</span></span>`;
      detectSummary.innerHTML=html;
    }
  }

  // ── 입력 이벤트 ──
  inputText.addEventListener('input', ()=>{
    const t = inputText.value;
    inputInfo.textContent = t.length ? t.length.toLocaleString()+'자' : '';
    maskBtn.disabled = t.trim().length===0;
    if(t.trim()) previewDetect(t);
    else detectSummary.innerHTML='<span class="detect-none">텍스트를 입력하면 탐지 결과가 표시됩니다.</span>';
  });

  // 옵션 변경 시 미리보기 갱신
  document.querySelectorAll('.toggle input, input[type=radio]').forEach(el=>{
    el.addEventListener('change',()=>{
      if(inputText.value.trim()) previewDetect(inputText.value);
    });
  });

  // ── 마스킹 적용 ──
  maskBtn.addEventListener('click',()=>{
    const {text, counts} = maskText(inputText.value);
    outputText.value = text;
    const total = counts.rrn+counts.phone+counts.email+counts.account;
    outputInfo.textContent = total ? `총 ${total}건 마스킹 완료` : '마스킹된 항목 없음';
    copyBtn.disabled = false;
    downloadBtn.disabled = false;
  });

  // ── 복사 ──
  copyBtn.addEventListener('click',()=>{
    navigator.clipboard.writeText(outputText.value).then(showToast);
  });

  // ── 다운로드 ──
  downloadBtn.addEventListener('click',()=>{
    const blob = new Blob([outputText.value], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'maskdoc_result.txt';
    a.click();
  });

  // ── 초기화 ──
  clearBtn.addEventListener('click',()=>{
    inputText.value=''; outputText.value='';
    inputInfo.textContent=''; outputInfo.textContent='';
    maskBtn.disabled=true; copyBtn.disabled=true; downloadBtn.disabled=true;
    detectSummary.innerHTML='<span class="detect-none">텍스트를 입력하면 탐지 결과가 표시됩니다.</span>';
  });
  </script>
</body>
</html>
