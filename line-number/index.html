  <script>
  var inputText   = document.getElementById('inputText');
  var outputText  = document.getElementById('outputText');
  var inputInfo   = document.getElementById('inputInfo');
  var outputInfo  = document.getElementById('outputInfo');
  var startNum    = document.getElementById('startNum');
  var padWidth    = document.getElementById('padWidth');
  var customSep   = document.getElementById('customSep');
  var includeEmpty = document.getElementById('includeEmpty');
  var currentSep  = '. ';

  document.querySelectorAll('.option-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.option-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentSep = btn.dataset.sep;
      customSep.value = '';
      render();
    });
  });

  customSep.addEventListener('input', function() {
    if (customSep.value) {
      document.querySelectorAll('.option-btn').forEach(function(b) { b.classList.remove('active'); });
      currentSep = customSep.value;
    }
    render();
  });

  [inputText, startNum, padWidth, includeEmpty].forEach(function(el) {
    el.addEventListener('input', render);
  });

  function render() {
    var raw = inputText.value;
    var lines = raw.length ? raw.split('\n') : [];
    inputInfo.textContent = lines.length + '줄';

    var start = parseInt(startNum.value, 10);
    if (isNaN(start)) start = 1;
    var pad = parseInt(padWidth.value, 10);
    if (isNaN(pad) || pad < 0) pad = 0;
    var sep = customSep.value || currentSep;
    var skipEmpty = !includeEmpty.checked;

    var num = start;
    var out = lines.map(function(line) {
      if (skipEmpty && line.trim() === '') return line;
      var label = String(num);
      if (pad > 0) label = label.padStart(pad, '0');
      num++;
      return label + sep + line;
    });

    outputText.value = out.join('\n');
    outputInfo.textContent = lines.length + '줄 · ' + outputText.value.length.toLocaleString() + '자';
  }

  document.getElementById('copyBtn').addEventListener('click', function() {
    if (!outputText.value) { showToast('복사할 결과가 없습니다'); return; }
    navigator.clipboard.writeText(outputText.value).then(function() {
      showToast('✓ 결과가 클립보드에 복사되었습니다');
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', function() {
    if (!outputText.value) { showToast('다운로드할 결과가 없습니다'); return; }
    var blob = new Blob([outputText.value], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'linenumber_result.txt';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('✓ .txt 파일이 저장됩니다');
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    inputText.value = '';
    outputText.value = '';
    startNum.value = 1;
    padWidth.value = 0;
    customSep.value = '';
    includeEmpty.checked = true;
    currentSep = '. ';
    document.querySelectorAll('.option-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.sep === '. '); });
    render();
  });

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  render();
  </script>
