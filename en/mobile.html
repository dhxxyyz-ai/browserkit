// ── Icon renderer ─────────────────────────────────────────────────────────────
function glyphInfo(code) {
  const m = {
    MaskFace:'face', ExifRemover:'exif',
    FitImage:'resize', CropImage:'crop', WatermarkImage:'watermark', ColorPicker:'droplet',
    PDFMerge:'merge', TextTools:'token:Aa', DiffChecker:'diff', MarkdownEditor:'token:M↓',
    FindReplace:'search', ImageBright:'sun', BGRemove:'token:BG',
    QRCode:'qr', PasswordGen:'key', UnitConvert:'token:↔', DateCalc:'calendar', WorldClock:'clock',
    JSONFormat:'token:{ }', RegexTest:'token:.*', Base64Tool:'token:64', HashGen:'token:#',
    ChartMaker:'chart', ImageText:'token:T', ImageFilter:'halfcircle', ImageCollage:'collage', PixelArt:'pixelart',
    MosaicMaker:'mosaic', PDFSplit:'split', LineNumber:'linenum', Minifier:'token:<>',
    URLEncode:'token:%20', CSSUnit:'token:rem', DiagramMaker:'diagram', PaletteGen:'palette',
    RandomPicker:'roulette', WordCloudGen:'wordcloud', FaviconGen:'favicon', SVGtoPNG:'token:SVG', PomodoroTimer:'pomodoro', UUIDGen:'token:UUID', JWTDecoder:'token:JWT', CronHelper:'token:CRON', SQLFormatter:'token:SQL', LoremGen:'token:Lo', ImageCompare:'compare', ImageFrame:'frame', CSVJSONConvert:'token:CSV', YAMLJSONConvert:'token:YML', QRScanner:'qrscan', TextStats:'textstats', ColorConverter:'colorswap', MarkdownTableConvert:'gridtable', CodeSnapshot:'codetag', MockupFrame:'phoneicon', GifMaker:'gifstack', PDFPasswordRemove:'pdflock', PDFPasswordSet:'pdflockkey', BmiCalc:'bmiscale', HttpStatusRef:'statuscode', XlsxCsvConvert:'xlstoken', PetAgeCalc:'petface', SplitBillCalc:'token:1/N', UnitPriceCalc:'pricetag', ColorContrastChecker:'token:AA', BarcodeGen:'barcode'
  };
  const v = m[code];
  if (!v) return { glyph:'token', token:'+' };
  if (v.indexOf('token:') === 0) return { glyph:'token', token:v.slice(6) };
  return { glyph:v, token:'' };
}

  else if (glyph==='collage') inner=`<div style="display:grid;grid-template-columns:12px 12px;grid-template-rows:12px 12px;gap:3px"><div style="background:#fffdf9;border-radius:2px"></div><div style="background:#fffdf9;border-radius:2px"></div><div style="background:#fffdf9;border-radius:2px"></div><div style="background:#fffdf9;border-radius:2px"></div></div>`;
  else if (glyph==='pixelart') inner=`<div style="display:grid;grid-template-columns:repeat(3,6px);grid-template-rows:repeat(3,6px);gap:2px"><div style="background:#fffdf9;border-radius:1px"></div><div style="background:${k};border-radius:1px"></div><div style="background:#fffdf9;border-radius:1px"></div><div style="background:${k};border-radius:1px"></div><div style="background:#fffdf9;border-radius:1px"></div><div style="background:${k};border-radius:1px"></div><div style="background:#fffdf9;border-radius:1px"></div><div style="background:${k};border-radius:1px"></div><div style="background:#fffdf9;border-radius:1px"></div></div>`;
  else if (glyph==='mosaic') inner=`<div style="display:grid;grid-template-columns:repeat(3,6px);grid-template-rows:repeat(3,6px);gap:2px"><div style="background:${k};border-radius:1px;opacity:.9"></div><div style="background:${k};border-radius:1px;opacity:.5"></div><div style="background:${k};border-radius:1px;opacity:.9"></div><div style="background:${k};border-radius:1px;opacity:.5"></div><div style="background:${k};border-radius:1px;opacity:.9"></div><div style="background:${k};border-radius:1px;opacity:.5"></div><div style="background:${k};border-radius:1px;opacity:.9"></div><div style="background:${k};border-radius:1px;opacity:.5"></div><div style="background:${k};border-radius:1px;opacity:.9"></div></div>`;
  else if (glyph==='diagram') inner=`<div style="position:relative;width:30px;height:26px"><div style="position:absolute;left:0;top:0;width:11px;height:8px;background:#fffdf9;border:2px solid ${k};border-radius:2px;box-sizing:border-box"></div><div style="position:absolute;right:0;top:0;width:11px;height:8px;background:#fffdf9;border:2px solid ${k};border-radius:2px;box-sizing:border-box"></div><div style="position:absolute;left:9px;bottom:0;width:11px;height:8px;background:#fffdf9;border:2px solid ${k};border-radius:2px;box-sizing:border-box"></div><div style="position:absolute;left:5px;top:8px;width:2px;height:6px;background:${k}"></div><div style="position:absolute;right:5px;top:8px;width:2px;height:6px;background:${k}"></div></div>`;
  else if (glyph==='palette') inner=`<div style="display:flex;gap:3px"><div style="width:11px;height:11px;border-radius:50%;background:#ff8a5e;border:2px solid ${k};box-sizing:border-box"></div><div style="width:11px;height:11px;border-radius:50%;background:#5dffb0;border:2px solid ${k};box-sizing:border-box;margin-top:8px"></div><div style="width:11px;height:11px;border-radius:50%;background:#6aa8ff;border:2px solid ${k};box-sizing:border-box"></div></div>`;
  else if (glyph==='exif') inner=`<div style="position:relative;width:26px;height:30px"><div style="width:20px;height:20px;border-radius:50% 50% 50% 0;background:#fffdf9;border:2.5px solid ${k};box-sizing:border-box;transform:rotate(-45deg);margin:0 auto"></div><div style="position:absolute;left:50%;top:6px;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:${k}"></div></div>`;
  else if (glyph==='roulette') inner=`<div style="position:relative;width:28px;height:28px;border-radius:50%;background:#fffdf9;border:2.5px solid ${k};box-sizing:border-box;overflow:hidden"><div style="position:absolute;left:0;top:0;width:14px;height:14px;background:#ff8a5e"></div><div style="position:absolute;right:0;top:0;width:14px;height:14px;background:#5dffb0"></div><div style="position:absolute;left:0;bottom:0;width:14px;height:14px;background:#6aa8ff"></div><div style="position:absolute;right:0;bottom:0;width:14px;height:14px;background:#ffe14d"></div></div>`;
  else if (glyph==='wordcloud') inner=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="font:700 13px Gowun Dodum,sans-serif;color:${k};line-height:1">Aa</div><div style="font:700 8px Gowun Dodum,sans-serif;color:rgba(42,36,51,.55);line-height:1">Café</div><div style="font:700 10px Gowun Dodum,sans-serif;color:rgba(42,36,51,.75);line-height:1">Word</div></div>`;
  else if (glyph==='favicon') inner=`<div style="width:24px;height:24px;border-radius:50%;background:#fffdf9;border:2.5px solid ${k};box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 12px Gowun Dodum,sans-serif;color:${k}">B</div>`;
  else if (glyph==='halfcircle') inner=`<div style="width:24px;height:24px;border-radius:50%;background:#fffdf9;border:2.5px solid ${k};box-sizing:border-box;position:relative;overflow:hidden"><div style="position:absolute;left:0;top:0;width:50%;height:100%;background:${k}"></div></div>`;
  else if (glyph==='calendar') inner=`<div style="position:relative;width:30px;height:30px;background:#fffdf9;border:2.5px solid ${k};border-radius:4px;box-sizing:border-box;overflow:hidden"><div style="position:absolute;top:0;left:0;width:100%;height:8px;background:${f};border-bottom:2.5px solid ${k}"></div><div style="position:absolute;top:13px;left:4px;width:4px;height:4px;background:${k};border-radius:1px"></div><div style="position:absolute;top:13px;left:13px;width:4px;height:4px;background:rgba(42,36,51,.3);border-radius:1px"></div><div style="position:absolute;top:13px;left:22px;width:4px;height:4px;background:rgba(42,36,51,.3);border-radius:1px"></div><div style="position:absolute;top:21px;left:4px;width:4px;height:4px;background:rgba(42,36,51,.3);border-radius:1px"></div><div style="position:absolute;top:21px;left:13px;width:4px;height:4px;background:${k};border-radius:1px"></div></div>`;
  else if (glyph==='clock') inner=`<div style="position:relative;width:28px;height:28px;border-radius:50%;background:#fffdf9;border:2.5px solid ${k};box-sizing:border-box"><div style="position:absolute;left:50%;top:50%;width:2.5px;height:9px;background:${k};border-radius:2px;transform-origin:bottom center;transform:translate(-50%,-100%)"></div><div style="position:absolute;left:50%;top:50%;width:2.5px;height:7px;background:${k};border-radius:2px;transform-origin:bottom center;transform:translate(-50%,-100%) rotate(90deg)"></div></div>`;
  else if (glyph==='chart') inner=`<div style="display:flex;align-items:flex-end;gap:3px;height:28px"><div style="width:6px;height:13px;background:#fffdf9;border:2px solid ${k};border-radius:2px 2px 0 0;box-sizing:border-box"></div><div style="width:6px;height:22px;background:#fffdf9;border:2px solid ${k};border-radius:2px 2px 0 0;box-sizing:border-box"></div><div style="width:6px;height:17px;background:#fffdf9;border:2px solid ${k};border-radius:2px 2px 0 0;box-sizing:border-box"></div></div>`;
  else if (glyph==='key') inner=`<div style="position:relative;width:30px;height:18px;display:flex;align-items:center"><div style="width:15px;height:15px;border-radius:50%;background:transparent;border:3px solid ${k};box-sizing:border-box"></div><div style="position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:3px;background:${k};border-radius:2px"></div><div style="position:absolute;right:1px;top:50%;width:3px;height:7px;background:${k};border-radius:2px"></div><div style="position:absolute;right:6px;top:50%;width:3px;height:7px;background:${k};border-radius:2px"></div></div>`;
  else if (glyph==='pomodoro') inner=`<div style="position:relative;width:26px;height:26px;border-radius:50%;background:#ff8a5e;border:2.5px solid ${k};box-sizing:border-box"><div style="position:absolute;left:50%;top:50%;width:2px;height:8px;background:${k};border-radius:2px;transform-origin:bottom center;transform:translate(-50%,-100%)"></div><div style="position:absolute;left:50%;top:50%;width:2px;height:6px;background:${k};border-radius:2px;transform-origin:bottom center;transform:translate(-50%,-100%) rotate(115deg)"></div></div>`;
  else if (glyph==='compare') inner=`<div style="width:24px;height:24px;border-radius:6px;background:#fffdf9;border:2.5px solid ${k};box-sizing:border-box;position:relative;overflow:hidden"><div style="position:absolute;left:0;top:0;width:50%;height:100%;background:${k}"></div><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:3px;height:16px;background:#fffdf9;border-radius:2px"></div></div>`;
  else if (glyph==='frame') inner=`<div style="width:26px;height:26px;background:#fffdf9;border:3.5px solid ${k};border-radius:3px;box-sizing:border-box"></div>`;
  else if (glyph==='textstats') inner=`<div style="display:flex;align-items:flex-end;gap:3px;height:28px"><div style="width:6px;height:13px;background:#fffdf9;border:2px solid ${k};border-radius:2px 2px 0 0;box-sizing:border-box"></div><div style="width:6px;height:22px;background:#fffdf9;border:2px solid ${k};border-radius:2px 2px 0 0;box-sizing:border-box"></div><div style="width:6px;height:17px;background:#fffdf9;border:2px solid ${k};border-radius:2px 2px 0 0;box-sizing:border-box"></div></div>`;
  else if (glyph==='colorswap') inner=`<div style="position:relative;width:28px;height:22px"><div style="position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:#ff8a5e;border:2px solid ${k};box-sizing:border-box"></div><div style="position:absolute;right:0;top:0;width:18px;height:18px;border-radius:50%;background:#6aa8ff;border:2px solid ${k};box-sizing:border-box;opacity:.85"></div></div>`;
  else if (glyph==='gridtable') inner=`<div style="display:grid;grid-template-columns:repeat(2,10px);grid-template-rows:repeat(2,10px);gap:2px"><div style="background:#fffdf9;border:1.5px solid ${k};box-sizing:border-box"></div><div style="background:#fffdf9;border:1.5px solid ${k};box-sizing:border-box"></div><div style="background:#fffdf9;border:1.5px solid ${k};box-sizing:border-box"></div><div style="background:#fffdf9;border:1.5px solid ${k};box-sizing:border-box"></div></div>`;
  else if (glyph==='codetag') inner=`<div style="font:700 15px Fira Code,monospace;color:${k};line-height:1;letter-spacing:-.5px;white-space:nowrap">&lt;/&gt;</div>`;
  else if (glyph==='phoneicon') inner=`<div style="width:18px;height:26px;background:#fffdf9;border:2.5px solid ${k};border-radius:4px;box-sizing:border-box"></div>`;
  else if (glyph==='pdflock') inner=`<div style="position:relative;width:22px;height:26px"><div style="width:22px;height:16px;background:#fffdf9;border:2.5px solid ${k};border-radius:3px;box-sizing:border-box;position:absolute;bottom:0"></div><div style="width:11px;height:10px;border:2.5px solid ${k};border-bottom:none;border-radius:6px 6px 0 0;box-sizing:border-box;position:absolute;top:-1px;left:10px;transform:rotate(25deg);transform-origin:bottom left"></div></div>`;
  else if (glyph==='coinstack') inner=`<div style="position:relative;width:24px;height:22px"></div>`;
  else if (glyph==='gifstack') inner=`<div style="position:relative;width:26px;height:22px"><div style="position:absolute;left:0;top:6px;width:14px;height:14px;background:#fffdf9;border:2px solid ${k};border-radius:2px;box-sizing:border-box;opacity:.4"></div><div style="position:absolute;left:6px;top:3px;width:14px;height:14px;background:#fffdf9;border:2px solid ${k};border-radius:2px;box-sizing:border-box;opacity:.7"></div><div style="position:absolute;left:12px;top:0;width:14px;height:14px;background:#fffdf9;border:2px solid ${k};border-radius:2px;box-sizing:border-box"></div></div>`;
  else if (glyph==='bmiscale') inner=`<div style="position:relative;width:26px;height:26px;border-radius:50%;background:#fffdf9;border:2.5px solid ${k};box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 9px Fira Code,monospace;color:${k}">BMI</div>`;
  else if (glyph==='statuscode') inner=`<div style="font:700 15px Fira Code,monospace;color:${k};line-height:1;letter-spacing:-.5px;white-space:nowrap">404</div>`;
  else if (glyph==='xlstoken') inner=`<div style="font:700 13px Gowun Dodum,sans-serif;color:${k};line-height:1;letter-spacing:-.5px;white-space:nowrap">XLS</div>`;
  else if (glyph==='pdflockkey') inner=`<div style="position:relative;width:22px;height:26px"><div style="width:22px;height:16px;background:#fffdf9;border:2.5px solid ${k};border-radius:3px;box-sizing:border-box;position:absolute;bottom:0;display:flex;align-items:center;justify-content:center"><div style="width:4px;height:4px;border-radius:50%;background:${k}"></div></div><div style="width:12px;height:11px;border:2.5px solid ${k};border-bottom:none;border-radius:6px 6px 0 0;box-sizing:border-box;position:absolute;top:0;left:5px"></div></div>`;
  else if (glyph==='petface') inner=`<div style="position:relative;width:30px;height:24px"><div style="position:absolute;left:-2px;top:3px;width:9px;height:13px;background:#fffdf9;border:2.5px solid ${k};border-radius:50% 50% 45% 45%/60% 60% 40% 40%;transform:rotate(-18deg);box-sizing:border-box"></div><div style="position:absolute;right:-2px;top:3px;width:9px;height:13px;background:#fffdf9;border:2.5px solid ${k};border-radius:50% 50% 45% 45%/60% 60% 40% 40%;transform:rotate(18deg);box-sizing:border-box"></div><div style="position:absolute;left:4px;top:5px;width:22px;height:19px;border-radius:50%;background:#fffdf9;border:2.5px solid ${k};box-sizing:border-box"></div><div style="position:absolute;left:10px;top:13px;width:3px;height:3px;border-radius:50%;background:${k}"></div><div style="position:absolute;right:10px;top:13px;width:3px;height:3px;border-radius:50%;background:${k}"></div><div style="position:absolute;left:50%;top:16px;width:5px;height:4px;border-radius:50%;background:${k};transform:translateX(-50%)"></div></div>`;
  else if (glyph==='pricetag') inner=`<div style="position:relative;width:22px;height:22px;background:#fffdf9;border:2.5px solid ${k};border-radius:4px 11px 4px 4px;box-sizing:border-box;transform:rotate(-45deg)"><div style="position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%;background:${k}"></div></div>`;
  else if (glyph==='barcode') inner=`<div style="display:flex;align-items:center;gap:1.5px;height:24px"><div style="width:2px;height:100%;background:${k}"></div><div style="width:1px;height:100%;background:${k}"></div><div style="width:3px;height:100%;background:${k}"></div><div style="width:1px;height:100%;background:${k}"></div><div style="width:2px;height:100%;background:${k}"></div><div style="width:1px;height:100%;background:${k}"></div><div style="width:2px;height:100%;background:${k}"></div></div>`;
  else inner=`<div style="font:700 16px Gowun Dodum,sans-serif;color:${k};line-height:1;letter-spacing:-.5px;white-space:nowrap">${token||'+'}</div>`;
  return `<div style="width:46px;height:46px;background:${f};border:2.5px solid ${k};border-radius:14px 11px 13px 10px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 -7px 0 rgba(0,0,0,.08)">${inner}</div>`;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── State ─────────────────────────────────────────────────────────────────────
const S = { langOpen: false };

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const { ink, accent, folders:F, wallpaper } = PAL;

  const catHtml = TOOLBOX_CATS.map((cat, ci) => {
    const items = cat.keys.map(key => {
      const gi = glyphInfo(key);
      const url = BASE_URL + (TOOL_URLS[key] || '/en/');
      return `<a href="${url}" style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px">
        ${toolIcon(F[ci%F.length], ink, gi.glyph, gi.token)}
        <div style="font:400 13px Gowun Dodum,sans-serif;text-align:center;color:${ink};line-height:1.2;word-break:keep-all">${esc(TOOL_LABEL[key]||key)}</div>
      </a>`;
    }).join('');
    return `<fieldset style="border:2px dashed rgba(42,36,51,.28);border-radius:13px;padding:0 8px 8px">
      <legend style="font:700 14px Gowun Dodum,sans-serif;color:${ink};padding:0 8px;background:rgba(255,255,255,.7);border:1.5px solid ${ink};border-radius:7px">${esc(cat.label)}</legend>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px">${items}</div>
    </fieldset>`;
  }).join('');

  const langMenuHtml = `<div class="lang-switcher">
    <button class="lang-switcher-btn" type="button" id="bk-lang-btn">🌐 <span>English</span></button>
    <div class="lang-switcher-menu${S.langOpen?' show':''}" id="bk-lang-menu">
      <a href="#" class="active">English</a>
      <a href="/">한국어</a>
    </div>
  </div>`;

  document.getElementById('bk-app').innerHTML = `
  <div style="min-height:100vh;background:${wallpaper};padding-bottom:120px">

    <!-- Sticky header -->
    <div style="position:sticky;top:0;z-index:100;background:#fbf6ff;box-shadow:0 2px 16px rgba(42,36,51,.08)">
      <div style="padding:10px 16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:100%;display:flex;justify-content:flex-end">${langMenuHtml}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;border-radius:50%;background:${accent};border:2.5px solid ${ink};display:flex;align-items:center;justify-content:center;color:#fff;font:700 16px Gowun Dodum,sans-serif;transform:rotate(-6deg)">B</div>
          <div style="font:700 28px Gowun Dodum,sans-serif;letter-spacing:-.5px"><span style="color:${ink}">Browser</span><span style="color:${accent}">Kit</span></div>
        </div>
        <div style="font:400 14px Gowun Dodum,sans-serif;color:rgba(42,36,51,.62)">100% Free · No Server Uploads</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
          <a href="${BASE_URL}/en/about.html" style="font:400 12px Gowun Dodum,sans-serif;color:rgba(42,36,51,.5);border-bottom:1px solid rgba(42,36,51,.25)">About</a>
          <a href="${BASE_URL}/en/blog/"      style="font:400 12px Gowun Dodum,sans-serif;color:rgba(42,36,51,.5);border-bottom:1px solid rgba(42,36,51,.25)">Blog</a>
          <a href="${BASE_URL}/en/privacy.html" style="font:400 12px Gowun Dodum,sans-serif;color:rgba(42,36,51,.5);border-bottom:1px solid rgba(42,36,51,.25)">Privacy Policy</a>
          <a href="${BASE_URL}/en/terms.html"   style="font:400 12px Gowun Dodum,sans-serif;color:rgba(42,36,51,.5);border-bottom:1px solid rgba(42,36,51,.25)">Terms of Service</a>
        </div>
      </div>
      <!-- Top display ad (sticky) -->
      <div style="padding:6px 0;text-align:center;border-top:1px solid rgba(42,36,51,.08);display:flex;justify-content:center">
        <!-- Google AdSense Display Ad — pending approval, reserving space -->
        <div class="ad-slot bk-ad-top" style="min-height:50px;width:320px"></div>
      </div>
    </div>

    <!-- Toolbox -->
    <fieldset id="bk-tools" style="margin:14px 12px 0;border:3px solid ${ink};border-radius:18px;background:rgba(255,255,255,.42);padding:6px 12px 12px">
      <legend style="font:700 20px Gowun Dodum,sans-serif;color:${ink};padding:2px 12px;background:rgba(255,255,255,.78);border:2.5px solid ${ink};border-radius:10px;margin-left:10px">Toolbox</legend>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">${catHtml}</div>
    </fieldset>

  </div>

  <!-- Bottom fixed multiplex ad -->
  <div style="position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(251,246,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 -2px 16px rgba(42,36,51,.08);display:flex;justify-content:center;padding:6px 0">
    <!-- Google AdSense Multiplex Ad — pending approval, reserving space -->
    <div class="ad-slot bk-ad-bottom" style="min-height:50px;width:320px"></div>
  </div>`;

  const langBtn = document.getElementById('bk-lang-btn');
  const langMenu = document.getElementById('bk-lang-menu');
  if (langBtn && langMenu) {
    langBtn.onclick = e => { e.stopPropagation(); S.langOpen = !S.langOpen; langMenu.classList.toggle('show', S.langOpen); };
    document.addEventListener('click', e => {
      if (S.langOpen && !e.target.closest('.lang-switcher')) { S.langOpen = false; langMenu.classList.remove('show'); }
    });
  }

  // Google AdSense (restore once approved):
  // document.querySelectorAll('.bk-ad-top, .bk-ad-bottom').forEach(el => {
  //   if (!el.dataset.adsbygoogleStatus) {
  //     try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
  //   }
  // });
}

// ── Loading → app transition ─────────────────────────────────────────────────
(function () {
  const ld = document.getElementById('bk-loading');
  const dotsEl = document.getElementById('bk-dots');
  const dots = ['', '.', '..', '...'];
  let n = 0;
  const iv = setInterval(() => { dotsEl.textContent = dots[n++ % dots.length]; }, 420);

  function show() {
    clearInterval(iv);
    render();
    document.getElementById('bk-app').style.display = 'block';
    ld.style.transition = 'opacity .45s ease';
    ld.style.opacity = '0';
    setTimeout(() => { ld.style.display = 'none'; }, 480);
  }

  if (document.readyState === 'complete') {
    setTimeout(show, 600);
  } else {
    window.addEventListener('load', () => setTimeout(show, 600));
  }
})();
</script>
</body>
