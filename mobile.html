  return `<div style="position:relative;width:58px;height:46px"><div style="position:absolute;left:3px;top:0;width:26px;height:13px;background:${f};border:2.5px solid ${k};border-radius:7px 9px 0 0;box-sizing:border-box"></div><div style="position:absolute;left:0;bottom:0;width:58px;height:37px;background:${f};border:2.5px solid ${k};border-radius:5px 9px 8px 7px;box-sizing:border-box"></div><div style="position:absolute;left:8px;bottom:27px;width:30px;height:3px;background:rgba(255,255,255,.55);border-radius:3px"></div></div>`;
}

function computerIcon(fill, ink) {
  const f=fill||'#bcd4ff', k=ink||'#2a2433';
  return `<div style="position:relative;width:52px;height:48px"><div style="position:absolute;top:0;left:0;width:52px;height:37px;background:${f};border:2.5px solid ${k};border-radius:8px;box-sizing:border-box"></div><div style="position:absolute;top:5px;left:5px;width:42px;height:23px;background:rgba(255,255,255,.55);border-radius:4px"></div><div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:9px;background:${f};border:2.5px solid ${k};border-radius:0 0 5px 5px;box-sizing:border-box"></div></div>`;
}

function recycleIcon(fill, ink) {
  const f=fill||'#a8e6cf', k=ink||'#2a2433';
  return `<div style="position:relative;width:44px;height:48px"><div style="position:absolute;top:0;left:5px;width:34px;height:7px;background:${f};border:2.5px solid ${k};border-radius:5px;box-sizing:border-box"></div><div style="position:absolute;top:-3px;left:16px;width:12px;height:5px;background:${f};border:2.5px solid ${k};border-radius:4px 4px 0 0;box-sizing:border-box"></div><div style="position:absolute;top:9px;left:7px;width:30px;height:38px;background:${f};border:2.5px solid ${k};border-radius:3px 3px 7px 7px;box-sizing:border-box;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%)"></div><div style="position:absolute;top:16px;left:16px;width:3px;height:22px;background:rgba(255,255,255,.6);border-radius:3px"></div><div style="position:absolute;top:16px;left:25px;width:3px;height:22px;background:rgba(255,255,255,.6);border-radius:3px"></div></div>`;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── 상태 ──────────────────────────────────────────────────────────────────────
const S = {};

// ── 렌더 ──────────────────────────────────────────────────────────────────────
function render() {

        </div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
          <a href="${BASE_URL}/about.html" style="font:400 12px Gowun Dodum,sans-serif;color:rgba(42,36,51,.5);border-bottom:1px solid rgba(42,36,51,.25)">소개</a>
          <a href="${BASE_URL}/blog/"      style="font:400 12px Gowun Dodum,sans-serif;color:rgba(42,36,51,.5);border-bottom:1px solid rgba(42,36,51,.25)">블로그</a>
          <a href="${BASE_URL}/privacy.html" style="font:400 12px Gowun Dodum,sans-serif;color:rgba(42,36,51,.5);border-bottom:1px solid rgba(42,36,51,.25)">개인정보 처리방침</a>
          <a href="${BASE_URL}/terms.html"   style="font:400 12px Gowun Dodum,sans-serif;color:rgba(42,36,51,.5);border-bottom:1px solid rgba(42,36,51,.25)">이용약관</a>
        </div>
      </div>
      <!-- 상단 디스플레이 광고 (sticky) -->
      <div style="padding:6px 0;text-align:center;border-top:1px solid rgba(42,36,51,.08)">
        <ins class="adsbygoogle bk-ad-top" style="display:block;min-height:50px"
          data-ad-client="ca-pub-2077977787979506"
          data-ad-slot="6825825428"
          data-ad-format="auto"

    <!-- 도구상자 -->
    <fieldset id="bk-tools" style="margin:14px 12px 0;border:3px solid ${ink};border-radius:18px;background:rgba(255,255,255,.42);padding:6px 12px 12px">
      <legend style="font:700 20px Gowun Dodum,sans-serif;color:${ink};padding:2px 12px;background:rgba(255,255,255,.78);border:2.5px solid ${ink};border-radius:10px;margin-left:10px">도구상자</legend>

    </fieldset>

  </div>

  <!-- 하단 고정 멀티플렉스 광고 -->

    <ins class="adsbygoogle bk-ad-bottom" style="display:block;min-height:100px"
      data-ad-client="ca-pub-2077977787979506"
      data-ad-slot="9500090221"

  </div>`;

  // 광고 초기화 (이미 초기화된 슬롯 제외)
  document.querySelectorAll('.bk-ad-top, .bk-ad-bottom').forEach(el => {
    if (!el.dataset.adsbygoogleStatus) {
      try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
    }
  });
}

// ── 로딩 → 앱 전환 ───────────────────────────────────────────────────────────
(function () {
  const ld = document.getElementById('bk-loading');
  const dotsEl = document.getElementById('bk-dots');
  const dots = ['', '.', '..', '...'];
  let n = 0;
  const iv = setInterval(() => { dotsEl.textContent = dots[n++ % dots.length]; }, 420);

  function show() {
    clearInterval(iv);
    render();
    document.getElementById('bk-app').style.display = 'block';
    ld.style.transition = 'opacity .45s ease';
    ld.style.opacity = '0';
    setTimeout(() => { ld.style.display = 'none'; }, 480);
  }

  if (document.readyState === 'complete') {
    setTimeout(show, 600);
  } else {
    window.addEventListener('load', () => setTimeout(show, 600));
  }
})();
</script>
