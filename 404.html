<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BrowserKit — 페이지를 찾을 수 없습니다." />
  <title>404 — BrowserKit</title>
  <link rel="stylesheet" href="/css/style.css?v=20260724c" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    .error-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .error-code {
      font-size: 96px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      line-height: 1;
      background: linear-gradient(135deg, var(--point), var(--point-hover));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .error-icon {
      font-size: 48px;
      margin-bottom: 24px;
    }
    .error-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }
    .error-desc {
      font-size: 15px;
      color: var(--subtext);
      line-height: 1.8;
      max-width: 400px;
      margin: 0 auto 36px;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-home {
      display: inline-block;
      background: linear-gradient(135deg, var(--point), var(--point-hover));
      color: white;
      border-radius: 12px;
      padding: 13px 28px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Pretendard', sans-serif;
      text-decoration: none;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--glow);
      color: white;
    }
    .btn-back {
      display: inline-block;
      background: var(--card);
      color: var(--subtext);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 28px;
      font-size: 15px;
      font-family: 'Pretendard', sans-serif;
      text-decoration: none;
    }
    .btn-back:hover {
      transform: translateY(-2px);
      color: var(--text);
      border-color: var(--point);
    }
    .error-links {
      margin-top: 48px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .error-links a {
      color: var(--subtext);
      font-size: 14px;
    }
    .error-links a:hover { color: var(--text); }
  </style>
  <meta property="og:image" content="https://browserkit.online/img/og-browserkit.png" />
</head>
<body>

  <!-- 헤더 -->
  <header class="header">
    <div class="container">
      <a href="/" class="header-brand">
        <div style="width:28px;height:28px;border-radius:50%;background:#7b6cff;border:2.5px solid #2a2433;display:flex;align-items:center;justify-content:center;color:#fff;font:700 18px Gowun Dodum,sans-serif;flex-shrink:0">B</div>
        <span class="header-brand-text"><span style="color:var(--text)">Browser</span><span style="color:var(--point)">Kit</span></span>
      </a>
    </div>
  </header>

  <!-- 에러 본문 -->
  <div class="error-wrap">
    <div class="error-icon">🔍</div>
    <div class="error-code">404</div>
    <h1 class="error-title">페이지를 찾을 수 없습니다</h1>
    <p class="error-desc">
      요청하신 페이지가 존재하지 않거나 이동되었습니다.<br />
      주소를 다시 확인하거나 아래 버튼으로 돌아가세요.
    </p>
    <div class="error-actions">
      <a href="/" class="btn-home">홈으로 이동</a>
      <a href="javascript:history.back()" class="btn-back">← 이전 페이지</a>
    </div>
    <nav class="error-links">
      <a href="/">메인</a>
      <a href="/about">서비스 소개</a>
      <a href="/blog/">블로그</a>
      <a href="/privacy">개인정보 처리방침</a>
      <a href="/terms">이용약관</a>
    </nav>
  </div>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="container">
      <p class="footer-copy">&#xa9; 2026 BrowserKit. 모든 처리는 브라우저 내에서 이루어집니다.</p>
      <nav class="footer-nav">
        <a href="/privacy">개인정보 처리방침</a>
        <a href="/terms">이용약관</a>
        <a href="/about">서비스 소개</a>
        <a href="/blog/">블로그</a>
      </nav>
    </div>
  </footer>

</body>
</html>
