    .input-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 24px; margin-bottom:20px; }

  <script>
  var SAMPLE_NAMES = ['홍길동', '김철수', '이영희', '박민수'];
  var SAMPLE_RESULTS = ['커피 쏘기', '청소 당번', '꽝', '설거지'];
  var LADDER_COLORS = ['#ff8a5e', '#5dffb0', '#6aa8ff', '#ffd36e', '#e0c3ff', '#ffb3c7', '#a8e6cf', '#bcd4ff'];
  var INK = '#2a2433';
  var ROWS = 12;

  var nameInput = document.getElementById('nameInput');
  var resultInput = document.getElementById('resultInput');
  var nameCount = document.getElementById('nameCount');
  var resultCount = document.getElementById('resultCount');
  var prepBtn = document.getElementById('prepBtn');
  var startBtn = document.getElementById('startBtn');
  var ladderWrap = document.getElementById('ladderWrap');
  var ladderNames = document.getElementById('ladderNames');
  var ladderResults = document.getElementById('ladderResults');
  var ladderCanvas = document.getElementById('ladderCanvas');
  var resultTableCard = document.getElementById('resultTableCard');
  var resultList = document.getElementById('resultList');

  var lastResults = [];
  var ladderState = null; // { n, colGap, margin, height, rungsByRow, ctx }

  function parseLines(text) {
    return text.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  function resetLadder() {
    ladderState = null;
    ladderWrap.classList.remove('show');
    resultTableCard.classList.remove('show');
    lastResults = [];
    startBtn.disabled = true;
  }

  function updateState() {
    var names = parseLines(nameInput.value);
    var results = parseLines(resultInput.value);
    nameCount.textContent = names.length + '명';
    resultCount.textContent = results.length + '개';
    prepBtn.disabled = names.length < 2 || names.length !== results.length;
    resetLadder();
  }
  nameInput.addEventListener('input', updateState);
  resultInput.addEventListener('input', updateState);

  document.getElementById('sampleBtn').addEventListener('click', function() {
    nameInput.value = SAMPLE_NAMES.join('\n');
    resultInput.value = SAMPLE_RESULTS.join('\n');
    updateState();
  });
  document.getElementById('clearBtn').addEventListener('click', function() {
    nameInput.value = '';
    resultInput.value = '';
    updateState();
  });

  function generateRungs(n) {
    var rungsByRow = [];
    for (var r = 0; r < ROWS; r++) {
      var set = {};
      var col = 0;
      while (col < n - 1) {
        if (Math.random() < 0.35) { set[col] = true; col += 2; }
        else { col += 1; }
      }
      rungsByRow.push(set);
    }
    return rungsByRow;
  }

  function traceColumn(startCol, rungsByRow) {
    var col = startCol;
    for (var r = 0; r < ROWS; r++) {
      var set = rungsByRow[r];
      if (set[col]) col = col + 1;
      else if (set[col - 1]) col = col - 1;
    }
    return col;
  }

  function colX(colGap, margin, col) { return margin + col * colGap; }

  function drawBaseLadder(ctx, n, colGap, margin, height, rungsByRow) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    var rowH = (height - 40) / ROWS;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    for (var c = 0; c < n; c++) {
      var x = colX(colGap, margin, c);
      ctx.beginPath();
      ctx.moveTo(x, 20);
      ctx.lineTo(x, height - 20);
      ctx.stroke();
    }
    for (var r = 0; r < ROWS; r++) {
      var y = 20 + r * rowH + rowH / 2;
      Object.keys(rungsByRow[r]).forEach(function(colStr) {
        var c2 = parseInt(colStr, 10);
        ctx.beginPath();
        ctx.moveTo(colX(colGap, margin, c2), y);
        ctx.lineTo(colX(colGap, margin, c2 + 1), y);
        ctx.stroke();
      });
    }
  }

  function buildPathPoints(startCol, rungsByRow, colGap, margin, height) {
    var rowH = (height - 40) / ROWS;
    var col = startCol;
    var pts = [{ x: colX(colGap, margin, col), y: 20 }];
    for (var r = 0; r < ROWS; r++) {
      var y0 = 20 + r * rowH;
      var yMid = y0 + rowH / 2;
      var y1 = y0 + rowH;
      var set = rungsByRow[r];
      pts.push({ x: colX(colGap, margin, col), y: yMid });
      if (set[col]) { col = col + 1; pts.push({ x: colX(colGap, margin, col), y: yMid }); }
      else if (set[col - 1]) { col = col - 1; pts.push({ x: colX(colGap, margin, col), y: yMid }); }
      pts.push({ x: colX(colGap, margin, col), y: y1 });
    }
    return { points: pts, endCol: col };
  }

  function pathLength(pts) {
    var total = 0;
    for (var i = 1; i < pts.length; i++) {
      total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    }
    return total;
  }

  function drawFullPath(ctx, pts, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  // dist만큼 진행된 지점까지 경로를 그리고, 그 지점 좌표를 반환
  function drawPartialPath(ctx, pts, color, dist) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    var remaining = dist;
    var tip = pts[0];
    for (var i = 1; i < pts.length; i++) {
      var segLen = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      if (remaining >= segLen) {
        ctx.lineTo(pts[i].x, pts[i].y);
        tip = pts[i];
        remaining -= segLen;
      } else {
        var t = segLen === 0 ? 0 : remaining / segLen;
        tip = { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t };
        ctx.lineTo(tip.x, tip.y);
        break;
      }
    }
    ctx.stroke();
    return tip;
  }

  function drawMarker(ctx, pt, color) {
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  prepBtn.addEventListener('click', function() {
    var names = parseLines(nameInput.value);
    var results = parseLines(resultInput.value);
    if (names.length < 2 || names.length !== results.length) {
      showToast('참가자 수와 결과 수가 같아야 합니다');
      return;
    }
    resultTableCard.classList.remove('show');

    var n = names.length;
    var colGap = Math.max(50, Math.min(110, 520 / n));
    var margin = colGap / 2;
    var width = margin * 2 + (n - 1) * colGap;
    var height = 340;

    ladderCanvas.width = width;
    ladderCanvas.height = height;
    ladderCanvas.style.width = width + 'px';
    ladderCanvas.style.height = height + 'px';

    ladderNames.style.width = width + 'px';
    ladderResults.style.width = width + 'px';
    ladderNames.innerHTML = names.map(function(name) {
      return '<div class="ladder-cell" style="width:' + colGap + 'px">' + escapeHtml(name) + '</div>';
    }).join('');

    var rungsByRow = generateRungs(n);
    var ctx = ladderCanvas.getContext('2d');
    drawBaseLadder(ctx, n, colGap, margin, height, rungsByRow);

    ladderResults.innerHTML = results.map(function() { return '<div class="ladder-cell result">?</div>'; }).join('');
    ladderResults.querySelectorAll('.ladder-cell').forEach(function(el) { el.style.width = colGap + 'px'; });

    ladderWrap.classList.add('show');
    ladderWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    ladderState = { names: names, results: results, n: n, colGap: colGap, margin: margin, height: height, rungsByRow: rungsByRow, ctx: ctx };
    startBtn.disabled = false;
    showToast('🪜 사다리가 준비됐어요! 이제 타기 시작을 눌러보세요');
  });

  startBtn.addEventListener('click', function() {
    if (!ladderState) return;
    prepBtn.disabled = true;
    startBtn.disabled = true;

    var st = ladderState;
    var ctx = st.ctx;
    var resultCells = ladderResults.querySelectorAll('.ladder-cell');
    var mapping = [];
    var completed = []; // { points, color }
    var DURATION = 900; // ms per participant

    function redraw(current) {
      drawBaseLadder(ctx, st.n, st.colGap, st.margin, st.height, st.rungsByRow);
      completed.forEach(function(c) { drawFullPath(ctx, c.points, c.color); });
      if (current) {
        var tip = drawPartialPath(ctx, current.points, current.color, current.dist);
        drawMarker(ctx, tip, current.color);
      }
    }

    function animateOne(i) {
      if (i >= st.n) {
        lastResults = st.names.map(function(name, idx) { return { name: name, result: st.results[mapping[idx]] }; });
        renderResultTable(lastResults);
        prepBtn.disabled = false;
        showToast('🎉 사다리 결과가 나왔어요!');
        return;
      }
      var built = buildPathPoints(i, st.rungsByRow, st.colGap, st.margin, st.height);
      var total = pathLength(built.points);
      var color = LADDER_COLORS[i % LADDER_COLORS.length];
      var startTime = null;

      function frame(t) {
        if (startTime === null) startTime = t;
        var elapsed = t - startTime;
        var dist = Math.min(total, (elapsed / DURATION) * total);
        redraw({ points: built.points, color: color, dist: dist });
        if (dist < total) {
          requestAnimationFrame(frame);
        } else {
          mapping[i] = built.endCol;
          completed.push({ points: built.points, color: color });
          resultCells[built.endCol].textContent = st.results[built.endCol];
          resultCells[built.endCol].style.color = color;
          redraw(null);
          animateOne(i + 1);
        }
      }
      requestAnimationFrame(frame);
    }
    animateOne(0);
  });

  function renderResultTable(items) {
    resultList.innerHTML = items.map(function(item) {
      return '<div class="result-row"><span class="result-row-name">' + escapeHtml(item.name) + '</span><span class="result-row-value">' + escapeHtml(item.result) + '</span></div>';
    }).join('');
    resultTableCard.classList.add('show');
  }

  document.getElementById('copyResultBtn').addEventListener('click', function() {
    if (!lastResults.length) { showToast('복사할 결과가 없습니다'); return; }
    var text = lastResults.map(function(item) { return item.name + ' → ' + item.result; }).join('\n');
    navigator.clipboard.writeText(text).then(function() {
      showToast('✓ 결과가 클립보드에 복사되었습니다');
    });
  });

  updateState();
  </script>
</body>
</html>
