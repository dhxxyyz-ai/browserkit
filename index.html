const TREE = buildTree();

function getNode(path) {
  let n = {children:TREE};
  for (const k of path) { n = n.children ? n.children[k] : null; if (!n) return null; }
  return n;
}

let _idc=0, _zc=20, _drag=null, _searchMD=null, _toolboxEl=null;
const S = { windows:[], startOpen:false, langOpen:false, time:'', dateStr:'', dateShort:'', palette:'msn' };

function tick() {
  const d=new Date(), h=d.getHours(), ampm=h<12?'오전':'오후';
  const hh=h%12||12, mm=String(d.getMinutes()).padStart(2,'0');
  const days=['일','월','화','수','목','금','토'];
  S.time=`${ampm} ${hh}:${mm}`;
  S.dateStr=`${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  S.dateShort=`${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
  render();
}

function openFolder(path,title){S.windows.push({id:++_idc,kind:'folder',path:[...path],title,x:150+(S.windows.length%5)*36,y:60+(S.windows.length%5)*30,z:++_zc});S.startOpen=false;render();}
function openFile(file){S.windows.push({id:++_idc,kind:'file',title:file.title,file,x:200+(S.windows.length%6)*30,y:80+(S.windows.length%6)*28,z:++_zc});S.startOpen=false;render();}
function openComputer(){S.windows.push({id:++_idc,kind:'computer',title:'내 컴퓨터',x:150+(S.windows.length%5)*36,y:60+(S.windows.length%5)*30,z:++_zc});S.startOpen=false;render();}
function openRecycle(){S.windows.push({id:++_idc,kind:'recycle',title:'휴지통',x:220+(S.windows.length%5)*30,y:90+(S.windows.length%5)*28,z:++_zc});S.startOpen=false;render();}
function closeWin(id){S.windows=S.windows.filter(w=>w.id!==id);render();}
function focusWin(id){
  const w=S.windows.find(x=>x.id===id);if(!w)return;
  w.z=++_zc;
  // Direct DOM update — avoids breaking click events fired after mousedown
  const el=document.querySelector(`.bk-win[data-wid="${id}"]`);
  if(el) el.style.zIndex=w.z;
  const pal=PALETTES[S.palette]||PALETTES.msn;
  document.querySelectorAll('.bk-task-btn').forEach(btn=>{
    const active=+btn.dataset.wid===id;
    btn.style.background=active?'rgba(255,255,255,.92)':'rgba(255,255,255,.42)';
    btn.style.boxShadow=active?`inset 0 2px 0 ${pal.ink}`:'none';
  });
}
function startDrag(id,e){
  const w=S.windows.find(x=>x.id===id);if(!w)return;
  w.z=++_zc;
  _drag={id,dx:e.clientX-w.x,dy:e.clientY-w.y};
  const el=document.querySelector(`.bk-win[data-wid="${id}"]`);
  if(el) el.style.zIndex=w.z;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function guideLabelHtml(s){const suf=' 사용법 완전 가이드';const str=String(s);if(str.endsWith(suf)){return '<span style="color:#7b6cff;font-weight:700">'+esc(str.slice(0,-suf.length))+'</span>'+esc(suf);}return esc(str);}

function folderItems(win,pal) {
  const F=pal.folders, k=pal.ink;
  if(win.kind==='computer') return [
    {name:'BrowserKit (C:)',iconType:'disk',fill:F[5],act:'noop',sub:'로컬 디스크'},
    {name:'도구',iconType:'folder',fill:F[0],act:'folder',path:['도구'],title:'도구'},
    {name:'블로그',iconType:'blog',fill:F[1],act:'folder',path:['블로그'],title:'블로그'},
    {name:'정보',iconType:'folder',fill:F[4],act:'folder',path:['정보'],title:'정보'}
  ];
  const node=getNode(win.path);
  if(!node||!node.children) return [];
  return Object.entries(node.children).map(([key,child],i)=>{
    if(child.type==='header') return {act:'header',name:child.label||key};
    const isF=child.type==='folder';
    const gi=child.type==='tool'?glyphInfo(key):{glyph:'',token:''};
    const fill=child.type==='tool'&&TOOL_CAT_IDX[key]!=null?F[TOOL_CAT_IDX[key]%F.length]:F[i%F.length];
    const item={name:child.label||key,iconType:child.type==='blog'?'blog':child.type,fill,glyph:gi.glyph,token:gi.token};
    if(isF){item.act='folder';item.path=[...win.path,key];item.title=child.label||key;}
    else{item.act='file';item.file={title:child.label||key,code:child.type==='tool'?key:'',kind:child.type,glyph:gi.glyph,token:gi.token};}
    if(child.type==='tool') item.sub=key;
    return item;
  });
}

      <div style="width:3px;height:30px;background:rgba(42,36,51,.18);border-radius:3px"></div>
      <div id="bk-search-wrap" style="position:relative;flex:0 0 auto">
        <div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.7);border:2px solid ${ink};border-radius:10px;padding:3px 10px;width:230px">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" style="flex:0 0 auto;opacity:.45"><circle cx="5" cy="5" r="3.5" stroke="${ink}" stroke-width="1.7"/><line x1="7.8" y1="7.8" x2="11.5" y2="11.5" stroke="${ink}" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input id="bk-search-input" placeholder="도구 검색" autocomplete="off" style="border:none;background:transparent;font:400 15px Gowun Dodum,sans-serif;color:${ink};outline:none;width:100%;min-width:0;user-select:auto">
        </div>
        <div id="bk-search-drop" style="display:none;position:absolute;bottom:calc(100% + 8px);left:0;min-width:100%;width:max-content;max-width:320px;background:${barBg};border:2.5px solid ${ink};border-radius:12px 12px 10px 10px;box-shadow:0 -8px 24px rgba(40,30,55,.22);overflow-y:auto;max-height:240px;z-index:9700"></div>
      </div>
      <div style="width:3px;height:30px;background:rgba(42,36,51,.18);border-radius:3px"></div>
      <div style="display:flex;align-items:center;gap:7px">${quickHtml}</div>
      <div style="width:3px;height:30px;background:rgba(42,36,51,.18);border-radius:3px"></div>
      <div style="flex:1 1 auto;display:flex;align-items:center;gap:7px;overflow:hidden">${taskHtml}</div>
      <div style="flex:0 0 auto;font:600 14px Gowun Dodum,sans-serif;color:${ink};white-space:nowrap">${esc(S.dateShort)} ${esc(S.time)}</div>
    </div>
  </div>`;
  document.getElementById('root').innerHTML = _html;
  // 도구상자 위젯(광고 포함)은 서비스 창을 열 때마다 다시 그려지지 않도록,
  // 최초 1회만 만들고 이후에는 같은 DOM 노드를 새 슬롯으로 옮기기만 한다.
  // innerHTML로 매번 새로 만들면 이미 채워진 광고 iframe이 매번 파괴되고
  // 다시 로드되어 배너가 깜빡이는 문제가 있었다.
  const toolboxSlot = document.getElementById('bk-toolbox-slot');
  if (toolboxSlot) {
    if (!_toolboxEl) {
      _toolboxEl = document.createElement('div');
      _toolboxEl.innerHTML = toolboxHtml;
    }
    toolboxSlot.appendChild(_toolboxEl);
  }
  wireEvents();
  // Google AdSense (승인 후 복원): if (SHOW_ADSENSE) { document.querySelectorAll('.adsbygoogle:not([data-adsbygoogle-status])').forEach(() => { (adsbygoogle = window.adsbygoogle || []).push({}); }); }
  if (SHOW_ADSENSE) loadKakaoAdFit();
}

// ── Wire events ───────────────────────────────────────────────────────────────
function wireEvents() {
  // Title bar drag (stopPropagation prevents win-focus handler from also firing)
  document.querySelectorAll('.bk-title').forEach(el => {
    el.onmousedown = e => { e.preventDefault(); e.stopPropagation(); startDrag(+el.dataset.wid, e); };
  });
  // Close button — use mousedown for instant response; stopPropagation blocks win-focus
  document.querySelectorAll('.bk-close').forEach(el => {
    el.onmousedown = e => { e.stopPropagation(); closeWin(+el.dataset.wid); };
  });
  // Window frame focus on any mousedown inside window
  document.querySelectorAll('.bk-win').forEach(el => {
    el.onmousedown = () => focusWin(+el.dataset.wid);
  });
  // Folder / file items inside windows
  document.querySelectorAll('.bk-folder-item').forEach(el => {
    const act = el.dataset.act;
    if (act === 'folder') el.onclick = () => openFolder(JSON.parse(el.dataset.path), el.dataset.title);
    else if (act === 'file') el.onclick = () => openFile(JSON.parse(el.dataset.file));
  });
  // Desktop icons
  document.querySelectorAll('.bk-desk-icon').forEach(el => {
    const act = el.dataset.act;
    if (act === 'folder') el.onclick = () => openFolder(JSON.parse(el.dataset.path), el.dataset.title);
    else if (act === 'computer') el.onclick = openComputer;
    else if (act === 'recycle') el.onclick = openRecycle;
  });
  // Start button
  const sb = document.querySelector('.bk-start-btn');
  if (sb) sb.onclick = () => { S.startOpen = !S.startOpen; render(); };
  // Start menu items
  document.querySelectorAll('.bk-start-item').forEach(el => {
    const act = el.dataset.act;
    el.onclick = () => {
      if (act === 'folder') openFolder(JSON.parse(el.dataset.path), el.dataset.title);
      else if (act === 'computer') openComputer();
      else if (act === 'recycle') openRecycle();
    };
  });
  // Taskbar quick folders
  document.querySelectorAll('.bk-quick-folder').forEach(el => {
    el.onclick = () => openFolder(JSON.parse(el.dataset.path), el.dataset.title);
  });
  // Taskbar window buttons
  document.querySelectorAll('.bk-task-btn').forEach(el => {
    el.onclick = () => focusWin(+el.dataset.wid);
  });
  // Nav bar "소개" link
  document.querySelectorAll('.bk-nav-item[data-act="file"]').forEach(el => {
    el.onclick = () => openFile(JSON.parse(el.dataset.file));
  });
  document.querySelectorAll('.bk-nav-item[data-act="folder"]').forEach(el => {
    el.onclick = () => openFolder(JSON.parse(el.dataset.path), el.dataset.title);
  });
  // Desktop background — close start menu on click outside
  const desk = document.getElementById('bk-desktop');
  if (desk) desk.onclick = e => {
    if (S.startOpen && !e.target.closest('.bk-start-btn')) { S.startOpen = false; render(); }
  };

  // Language switcher dropdown
  const langBtn = document.getElementById('bk-lang-btn');
  const langMenu = document.getElementById('bk-lang-menu');
  if (langBtn && langMenu) {
    langBtn.onclick = e => { e.stopPropagation(); S.langOpen = !S.langOpen; langMenu.classList.toggle('show', S.langOpen); };
    document.addEventListener('click', e => {
      if (S.langOpen && !e.target.closest('.lang-switcher')) { S.langOpen = false; langMenu.classList.remove('show'); }
    });
  }

  // Search box
  const searchInput = document.getElementById('bk-search-input');
  const searchDrop  = document.getElementById('bk-search-drop');
  if (searchInput && searchDrop) {
    const pal = PALETTES[S.palette] || PALETTES.msn;
    const k = pal.ink, ac = pal.accent, F = pal.folders;

    function buildDrop(q) {
      const list = q
        ? SEARCH_TOOLS.filter(t => t.name.includes(q) || t.code.toLowerCase().includes(q.toLowerCase()))
        : SEARCH_TOOLS;
      if (!list.length) {
        searchDrop.innerHTML = `<div style="padding:14px;font:400 15px Gowun Dodum,sans-serif;color:rgba(42,36,51,.5);text-align:center">검색 결과 없음</div>`;
      } else {
        searchDrop.innerHTML = list.map(t => {
          const gi = glyphInfo(t.code);
          const fc = F[TOOL_CAT_IDX[t.code]!=null?TOOL_CAT_IDX[t.code]%F.length:0];
          return `<div class="bk-search-item" data-code="${t.code}" data-name="${esc(t.name)}"
            style="display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;border-bottom:1.5px solid rgba(42,36,51,.08);min-height:54px">
            <div style="flex:0 0 auto;width:24px;height:24px;overflow:hidden;display:flex;align-items:center;justify-content:center"><div style="transform:scale(0.52);transform-origin:center;width:46px;height:46px;flex:0 0 46px">${icon('tool',fc,k,gi.glyph,gi.token)}</div></div>
            <span style="font:400 16px Gowun Dodum,sans-serif;color:${k};white-space:nowrap">${esc(t.name)}</span>
          </div>`;
        }).join('');
      }
      searchDrop.style.display = 'block';
      // hover style
      searchDrop.querySelectorAll('.bk-search-item').forEach(el => {
        el.onmouseenter = () => el.style.background = `rgba(123,108,255,.1)`;
        el.onmouseleave = () => el.style.background = '';
        el.onclick = () => {
          const gi = glyphInfo(el.dataset.code);
          openFile({title:el.dataset.name, code:el.dataset.code, kind:'tool', glyph:gi.glyph, token:gi.token});
          searchInput.value = '';
          searchDrop.style.display = 'none';
        };
      });
    }

    // 드롭다운 클릭 시 mousedown preventDefault → input blur 방지 → click 이벤트 정상 처리
    searchDrop.addEventListener('mousedown', e => e.preventDefault());

    searchInput.onfocus = () => buildDrop(searchInput.value);
    searchInput.oninput = () => buildDrop(searchInput.value);
    searchInput.onblur  = () => { searchDrop.style.display = 'none'; };

    // 외부 클릭 시 드롭다운 닫기 (리스너 누적 방지)
    if (_searchMD) document.removeEventListener('mousedown', _searchMD, true);
    _searchMD = e => {
      if (!document.getElementById('bk-search-wrap')?.contains(e.target)) {
        const drop = document.getElementById('bk-search-drop');
        if (drop) drop.style.display = 'none';
      }
    };
    document.addEventListener('mousedown', _searchMD, true);
  }
}

window.addEventListener('mousemove', e => {
  if (!_drag) return;
  const w = S.windows.find(x => x.id === _drag.id);
  if (!w) return;
  w.x = e.clientX - _drag.dx; w.y = e.clientY - _drag.dy;
  const el = document.querySelector(`.bk-win[data-wid="${_drag.id}"]`);
  if (el) { el.style.left = w.x + 'px'; el.style.top = w.y + 'px'; }
});
window.addEventListener('mouseup', () => { _drag = null; });

// ── Boot ──────────────────────────────────────────────────────────────────────
tick();
setInterval(tick,60000);

(function boot() {
  const ld = document.getElementById('bk-loading');
  const rt = document.getElementById('root');
  const dotsEl = document.getElementById('bk-dots');
  let n = 0;
  const iv = setInterval(() => {
    n++;
    dotsEl.textContent = '.'.repeat(n);
    if (n >= 5) {
      clearInterval(iv);
      setTimeout(() => {
        ld.style.transition = 'opacity 0.35s ease';
        ld.style.opacity = '0';
        rt.style.transition = 'transform 0.65s cubic-bezier(0.16,1,0.3,1), opacity 0.35s ease, border-radius 0.5s ease';
        rt.style.transform = 'scale(1)';
        rt.style.opacity = '1';
        rt.style.borderRadius = '0';
        setTimeout(() => { ld.style.display = 'none'; }, 700);
      }, 200);
    }
  }, 400);
})();
</script>
