  <style>
    .upload-zone { background:var(--card); border:2px dashed var(--border); border-radius:var(--radius); padding:48px 32px; text-align:center; cursor:pointer; margin-bottom:24px; transition:all 0.2s; }
    .upload-zone:hover, .upload-zone.drag-over { border-color:var(--point); box-shadow:0 0 24px var(--glow); }

    .upload-sub { color:var(--subtext); font-size:13px; }

    .work-area { display:none; }
    .work-area.show { display:block; }

    .preview-wrap { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
    .preview-pane { display:flex; flex-direction:column; gap:8px; }
    .pane-label { font-size:12px; font-weight:600; color:var(--subtext); padding:6px 0; }
    .canvas-wrap { background:repeating-conic-gradient(#1e1e2a 0% 25%,#26263a 0% 50%) 0 0/16px 16px; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:200px; }

    .slider-panel-title { font-size:14px; font-weight:700; color:var(--text); margin-bottom:20px; display:flex; align-items:center; gap:8px; }

    .range-slider { -webkit-appearance:none; height:6px; border-radius:3px; background:var(--border); outline:none; width:100%; }
    .range-slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--point); cursor:pointer; box-shadow:0 0 0 3px rgba(123,108,255,0.2); }

    .preset-wrap { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }

    .preset-btn:hover { border-color:var(--point); color:var(--text); }
    .preset-btn.active { background:rgba(123,108,255,0.15); border-color:var(--point); color:var(--point-hover); }

    .toggle-row { display:flex; align-items:center; gap:10px; margin-top:16px; }
    .toggle-row label { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--subtext); cursor:pointer; }
    .toggle-row input { accent-color:var(--point); cursor:pointer; width:16px; height:16px; }

    .action-bar { display:flex; gap:10px; margin-bottom:48px; flex-wrap:wrap; }
    .btn-primary { background:linear-gradient(135deg,var(--point),var(--point-hover)); color:white; border:none; border-radius:10px; padding:12px 24px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Gowun Dodum',sans-serif; transition:all 0.2s; white-space:nowrap; }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px var(--glow); }
    .btn-sub { background:var(--card); color:var(--subtext); border:1px solid var(--border); border-radius:10px; padding:12px 20px; font-size:14px; cursor:pointer; font-family:'Gowun Dodum',sans-serif; transition:all 0.2s; white-space:nowrap; }
    .btn-sub:hover { color:var(--text); border-color:var(--point); }
    .btn-danger { background:var(--card); color:#F87171; border:1px solid var(--border); border-radius:10px; padding:12px 20px; font-size:14px; cursor:pointer; font-family:'Gowun Dodum',sans-serif; transition:all 0.2s; white-space:nowrap; }
    .btn-danger:hover { border-color:#F87171; }

    .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--success); color:#fff; border-radius:999px; padding:10px 24px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; z-index:999; transition:all 0.3s ease; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    .footer { border-top:1px solid var(--border); padding:32px 0; text-align:center; }
    .footer-copy { color:var(--subtext); font-size:13px; margin-bottom:12px; }
    .footer-nav { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
    .footer-nav a { color:var(--subtext); font-size:13px; text-decoration:none; }
    .footer-nav a:hover { color:var(--text); }

      .hero-title { font-size:24px; }
      .slider-row { grid-template-columns:70px 1fr 50px; }

  <script>
  // ── 상태 ──
  var originalImage = null;
  var originalFile  = null;

  function clamp(v) { return Math.max(0, Math.min(255, Math.round(v))); }
  function formatBytes(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(2) + ' MB'; }

  // ── 블록 평균값 픽셀레이트 (ImageBright getImageData 패턴 재사용) ──
  function pixelate(ctx, w, h, block) {
    var imgData = ctx.getImageData(0, 0, w, h);
    var d = imgData.data;
    for (var y = 0; y < h; y += block) {
      var bh = Math.min(block, h - y);
      for (var x = 0; x < w; x += block) {
        var bw = Math.min(block, w - x);
        var rSum = 0, gSum = 0, bSum = 0, count = bw * bh;
        for (var yy = y; yy < y + bh; yy++) {
          for (var xx = x; xx < x + bw; xx++) {
            var idx = (yy * w + xx) * 4;
            rSum += d[idx]; gSum += d[idx+1]; bSum += d[idx+2];
          }
        }
        var rAvg = clamp(rSum / count), gAvg = clamp(gSum / count), bAvg = clamp(bSum / count);
        for (var yy2 = y; yy2 < y + bh; yy2++) {
          for (var xx2 = x; xx2 < x + bw; xx2++) {
            var idx2 = (yy2 * w + xx2) * 4;
            d[idx2] = rAvg; d[idx2+1] = gAvg; d[idx2+2] = bAvg;
          }
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function drawGrid(ctx, w, h, block) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 1;
    for (var x = block; x < w; x += block) {
      ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke();
    }
    for (var y = block; y < h; y += block) {
      ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke();
    }
    ctx.restore();
  }

  // ── 렌더링 ──
  function render() {
    if (!originalImage) return;
    var block = parseInt(document.getElementById('slBlock').value);
    var showGrid = document.getElementById('chkGrid').checked;
    var rc = document.getElementById('resultCanvas');
    var ctx = rc.getContext('2d');

    ctx.drawImage(originalImage, 0, 0, rc.width, rc.height);
    pixelate(ctx, rc.width, rc.height, block);
    if (showGrid) drawGrid(ctx, rc.width, rc.height, block);

    updateResultInfo(rc);
  }

  function updateResultInfo(canvas) {
    try {
      var dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      var bytes = Math.round(dataUrl.length * 0.75);
      document.getElementById('resultInfo').textContent = canvas.width + ' × ' + canvas.height + ' px · ≈' + formatBytes(bytes);
    } catch(e) {}
  }

  // ── 슬라이더 / 프리셋 ──
  document.getElementById('slBlock').addEventListener('input', function() {
    document.getElementById('valBlock').textContent = this.value + 'px';
    document.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.size === document.getElementById('slBlock').value); });
    render();
  });
  document.getElementById('chkGrid').addEventListener('change', render);
  document.querySelectorAll('.preset-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.getElementById('slBlock').value = btn.dataset.size;
      document.getElementById('valBlock').textContent = btn.dataset.size + 'px';
      document.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
  });

  // ── 업로드 ──
  var uploadZone = document.getElementById('uploadZone');
  var fileInput  = document.getElementById('fileInput');

  uploadZone.addEventListener('click', function() { fileInput.click(); });
  uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', function() { uploadZone.classList.remove('drag-over'); });
  uploadZone.addEventListener('drop', function(e) {
    e.preventDefault(); uploadZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', function() {
    if (fileInput.files[0]) loadImage(fileInput.files[0]);
  });

  function loadImage(file) {
    originalFile = file;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        originalImage = img;

        var maxW = 1400, maxH = 1400;
        var w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }

        var oc = document.getElementById('originalCanvas');
        oc.width = w; oc.height = h;
        oc.getContext('2d').drawImage(img, 0, 0, w, h);

        var rc = document.getElementById('resultCanvas');
        rc.width = w; rc.height = h;

        document.getElementById('fileInfo').textContent = file.name + ' · ' + w + ' × ' + h + ' px · ' + formatBytes(file.size);

        resetControls();
        render();

        document.getElementById('uploadZone').style.display = 'none';
        document.getElementById('workArea').classList.add('show');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function resetControls() {
    document.getElementById('slBlock').value = 12;
    document.getElementById('valBlock').textContent = '12px';
    document.getElementById('chkGrid').checked = false;
    document.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.size === '12'); });
  }

  // ── 다운로드 ──
  document.getElementById('downloadPng').addEventListener('click', function() {
    var rc = document.getElementById('resultCanvas');
    rc.toBlob(function(blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'pixelart_result.png';
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('✓ PNG 파일이 저장됩니다');
    }, 'image/png');
  });

  // ── 초기화 ──
  document.getElementById('resetBtn').addEventListener('click', function() {
    resetControls();
    render();
    showToast('↺ 초기화되었습니다');
  });

  // ── 다른 이미지 ──
  document.getElementById('newImageBtn').addEventListener('click', function() {
    originalImage = null; originalFile = null;
    fileInput.value = '';
    document.getElementById('workArea').classList.remove('show');
    document.getElementById('uploadZone').style.display = '';
    resetControls();
  });

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }
  </script>
