  <style>

/* 상태 바 */
    .status-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
    .status-badge { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:5px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); }
    .status-badge.valid { color:var(--success); border-color:var(--success); background:rgba(52,211,153,0.1); }
    .status-badge.error { color:#F87171; border-color:#F87171; background:rgba(248,113,113,0.1); }
    .status-badge.idle { color:var(--subtext); }
    .info-text { font-size:12px; color:var(--subtext); font-family:'Gowun Dodum',sans-serif; }

    /* 액션 버튼 묶음 */
    .action-bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .act-btn { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 18px; font-size:13px; font-weight:600; color:var(--subtext); cursor:pointer; font-family:'Gowun Dodum',sans-serif; transition:all 0.2s; white-space:nowrap; }
    .act-btn:hover { border-color:var(--point); color:var(--text); }
    .act-btn.primary { background:linear-gradient(135deg,var(--point),var(--point-hover)); color:white; border-color:transparent; }
    .act-btn.primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px var(--glow); }
    .act-btn.danger { color:#F87171; }
    .act-btn.danger:hover { border-color:#F87171; }

    /* 에디터 레이아웃 */
    .editor-wrap { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
    .editor-pane { display:flex; flex-direction:column; }
    .pane-label { font-size:12px; font-weight:600; color:var(--subtext); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
    .pane-copy { font-size:11px; color:var(--point-hover); cursor:pointer; background:rgba(123,108,255,0.1); border:1px solid var(--border); border-radius:6px; padding:2px 8px; font-family:'Gowun Dodum',sans-serif; }
    .pane-copy:hover { background:rgba(123,108,255,0.2); }
    .pane-copy.copied { color:var(--success); background:rgba(52,211,153,0.1); border-color:var(--success); }
    .code-area { background:#0a0a12; border:1px solid var(--border); border-radius:12px; padding:16px; font-family:'Fira Code','Cascadia Code','JetBrains Mono',monospace; font-size:13px; line-height:1.7; color:#e2e8f0; resize:vertical; min-height:360px; width:100%; outline:none; transition:border-color 0.2s; tab-size:2; }
    .code-area:focus { border-color:var(--point); }
    .code-area.error-border { border-color:#F87171; }
    .result-area { background:#0a0a12; border:1px solid var(--border); border-radius:12px; padding:16px; font-family:'Fira Code','Cascadia Code','JetBrains Mono',monospace; font-size:13px; line-height:1.7; color:#e2e8f0; min-height:360px; overflow:auto; white-space:pre; tab-size:2; }
    .result-placeholder { color:#4a5568; font-style:italic; }

    /* 오류 메시지 */
    .error-box { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.3); border-radius:10px; padding:12px 16px; margin-bottom:12px; font-size:13px; color:#F87171; font-family:'Gowun Dodum',sans-serif; display:none; }
    .error-box.show { display:block; }
    .error-location { font-weight:700; margin-right:6px; }

    /* 하이라이트 색상 */
    .json-string { color:#68d391; }
    .json-number { color:#63b3ed; }
    .json-boolean { color:#f6ad55; }
    .json-null { color:#fc8181; }
    .json-key { color:#b794f4; }
    .json-bracket { color:#e2e8f0; }

    /* 토스트 */
    .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--success); color:#fff; border-radius:999px; padding:10px 24px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; z-index:999; transition:all 0.3s ease; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    /* 배너 */
    .footer { border-top:1px solid var(--border); padding:32px 0; text-align:center; }
    .footer-copy { color:var(--subtext); font-size:13px; margin-bottom:12px; }
    .footer-nav { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
    .footer-nav a { color:var(--subtext); font-size:13px; text-decoration:none; }
    .footer-nav a:hover { color:var(--text); }

    @media (max-width:768px) {
      .editor-wrap { grid-template-columns:1fr; }
      .hero-title { font-size:24px; }
    }

  <script>
  // ── 상태 ──
  let lastResult = '';
  let validateTimer = null;

  const inputArea  = document.getElementById('inputArea');
  const resultArea = document.getElementById('resultArea');
  const statusBadge = document.getElementById('statusBadge');
  const infoText   = document.getElementById('infoText');
  const errorBox   = document.getElementById('errorBox');
  const errorLocation = document.getElementById('errorLocation');
  const errorMessage  = document.getElementById('errorMessage');

  // ── 유틸 ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function countLines(str) { return str ? str.split('\n').length : 0; }
  function countChars(str) { return str ? str.length : 0; }

  function updateInfo(str) {
    if (!str) { infoText.textContent = ''; return; }
    infoText.textContent = `${countLines(str)}줄 · ${countChars(str).toLocaleString()}자`;
  }

  // ── 구문 강조 ──
  function syntaxHighlight(json) {
    // JSON 문자열을 HTML로 변환 (XSS 방지 포함)
    return json
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
        let cls = 'json-number';
        if (/^"/.test(match)) {
          cls = /:$/.test(match) ? 'json-key' : 'json-string';
        } else if (/true|false/.test(match)) {
          cls = 'json-boolean';
        } else if (/null/.test(match)) {
          cls = 'json-null';
        }
        return `<span class="${cls}">${match}</span>`;
      });
  }

  function renderResult(text) {
    if (!text) {
      resultArea.innerHTML = '<span class="result-placeholder">왼쪽에 JSON을 입력하고 정렬 버튼을 누르세요.</span>';
      lastResult = '';
      return;
    }
    resultArea.innerHTML = syntaxHighlight(text);
    lastResult = text;
    updateInfo(text);
  }

  // ── 오류 파싱 ──
  function parseError(e, input) {
    const msg = e.message || String(e);
    // "at position N" 형태 추출
    const posMatch = msg.match(/at position (\d+)/);
    const propMatch = msg.match(/at JSON position (\d+)/);
    const pos = posMatch ? parseInt(posMatch[1]) : (propMatch ? parseInt(propMatch[1]) : null);

    let locationStr = '';
    if (pos !== null && input) {
      const before = input.slice(0, pos);
      const line = before.split('\n').length;
      const col  = before.split('\n').pop().length + 1;
      locationStr = `[${line}행 ${col}열]`;
    }
    return { msg: msg.replace(/at position \d+/, '').replace(/JSON position \d+/, '').trim(), location: locationStr };
  }

  // ── 유효성 검사 (실시간) ──
  function validateInput() {
    const raw = inputArea.value.trim();
    if (!raw) {
      setStatus('idle');
      errorBox.classList.remove('show');
      inputArea.classList.remove('error-border');
      infoText.textContent = '';
      return;
    }
    try {
      JSON.parse(raw);
      setStatus('valid');
      errorBox.classList.remove('show');
      inputArea.classList.remove('error-border');
      updateInfo(raw);
    } catch(e) {
      setStatus('error', e, raw);
    }
  }

  function setStatus(type, err, input) {
    if (type === 'idle') {
      statusBadge.className = 'status-badge idle';
      statusBadge.textContent = '⬜ 입력 대기';
    } else if (type === 'valid') {
      statusBadge.className = 'status-badge valid';
      statusBadge.textContent = '✅ 유효한 JSON';
    } else if (type === 'error') {
      statusBadge.className = 'status-badge error';
      statusBadge.textContent = '❌ JSON 오류';
      inputArea.classList.add('error-border');
      const {msg, location} = parseError(err, input);
      errorLocation.textContent = location;
      errorMessage.textContent = msg;
      errorBox.classList.add('show');
    }
  }

  inputArea.addEventListener('input', () => {
    clearTimeout(validateTimer);
    validateTimer = setTimeout(validateInput, 300);
  });

  // ── 정렬 ──
  function format(indent) {
    const raw = inputArea.value.trim();
    if (!raw) { showToast('JSON을 입력해주세요'); return; }
    try {
      const parsed = JSON.parse(raw);
      const pretty = JSON.stringify(parsed, null, indent);
      renderResult(pretty);
      errorBox.classList.remove('show');
      inputArea.classList.remove('error-border');
      setStatus('valid');
    } catch(e) {
      setStatus('error', e, raw);
      renderResult('');
    }
  }

  document.getElementById('btn2').addEventListener('click', () => format(2));
  document.getElementById('btn4').addEventListener('click', () => format(4));

  // ── 압축 ──
  document.getElementById('btnMin').addEventListener('click', () => {
    const raw = inputArea.value.trim();
    if (!raw) { showToast('JSON을 입력해주세요'); return; }
    try {
      const parsed = JSON.parse(raw);
      const minified = JSON.stringify(parsed);
      renderResult(minified);
      errorBox.classList.remove('show');
      inputArea.classList.remove('error-border');
      setStatus('valid');
    } catch(e) {
      setStatus('error', e, raw);
      renderResult('');
    }
  });

  // ── 샘플 ──
  const SAMPLE = {
    "name": "BrowserKit",
    "version": "2.0",
    "description": "브라우저 기반 무료 도구 모음",
    "tools": [
      { "id": "json-format", "category": "developer", "free": true },
      { "id": "qr-code",     "category": "utility",   "free": true },
      { "id": "color-picker","category": "image",      "free": true }
    ],
    "meta": {
      "author": "BrowserKit Team",
      "url": "https://browserkit.online",
      "serverless": true
    }
  };

  document.getElementById('btnSample').addEventListener('click', () => {
    inputArea.value = JSON.stringify(SAMPLE, null, 2);
    validateInput();
    format(2);
    showToast('✓ 샘플 JSON이 로드되었습니다');
  });

  // ── 초기화 ──
  document.getElementById('btnClear').addEventListener('click', () => {
    inputArea.value = '';
    renderResult('');
    setStatus('idle');
    errorBox.classList.remove('show');
    inputArea.classList.remove('error-border');
    infoText.textContent = '';
    lastResult = '';
  });

  // ── 복사 버튼 ──
  document.getElementById('copyInput').addEventListener('click', () => {
    const val = inputArea.value;
    if (!val) { showToast('복사할 내용이 없습니다'); return; }
    navigator.clipboard.writeText(val).then(() => {
      const btn = document.getElementById('copyInput');
      btn.textContent = '✓ 복사됨';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1500);
    });
  });

  document.getElementById('copyResult').addEventListener('click', () => {
    if (!lastResult) { showToast('복사할 결과가 없습니다'); return; }
    navigator.clipboard.writeText(lastResult).then(() => {
      const btn = document.getElementById('copyResult');
      btn.textContent = '✓ 복사됨';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1500);
      showToast('✓ 결과가 클립보드에 복사되었습니다');
    });
  });

  // ── Tab 키 들여쓰기 지원 ──
  inputArea.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = inputArea.selectionStart, end = inputArea.selectionEnd;
      inputArea.value = inputArea.value.slice(0, s) + '  ' + inputArea.value.slice(end);
      inputArea.selectionStart = inputArea.selectionEnd = s + 2;
    }
  });
  </script>
