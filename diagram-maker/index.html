  <script>
  // htmlLabels:false — 라벨을 <foreignObject> 대신 순수 SVG <text>로 렌더링.
  // foreignObject가 섞인 SVG는 Canvas로 그리는 순간 "tainted canvas"가 되어
  // PNG 내보내기(toBlob)가 조용히 실패하므로, PNG 다운로드를 위해 비활성화.
  mermaid.initialize({ startOnLoad: false, theme: 'default', flowchart: { htmlLabels: false } });

  var PRESETS = {
    flowchart: 'flowchart TD\n    A[시작] --> B{로그인 여부}\n    B -- 예 --> C[대시보드 이동]\n    B -- 아니오 --> D[로그인 페이지]\n    D --> E[로그인 시도]\n    E -- 성공 --> C\n    E -- 실패 --> D\n    C --> F[종료]',
    sequence: 'sequenceDiagram\n    participant U as 사용자\n    participant B as 브라우저\n    participant S as 서버\n    U->>B: 로그인 버튼 클릭\n    B->>S: 로그인 요청\n    S-->>B: 인증 토큰 응답\n    B-->>U: 대시보드 표시',
    er: 'erDiagram\n    CUSTOMER ||--o{ ORDER : places\n    ORDER ||--|{ ORDER_ITEM : contains\n    PRODUCT ||--o{ ORDER_ITEM : "included in"\n    CUSTOMER {\n        string name\n        string email\n    }\n    ORDER {\n        int id\n        date orderDate\n    }',
    gantt: 'gantt\n    title 프로젝트 일정\n    dateFormat YYYY-MM-DD\n    section 기획\n    요구사항 정의   :a1, 2026-07-01, 5d\n    설계            :a2, after a1, 4d\n    section 개발\n    프론트엔드       :b1, after a2, 8d\n    백엔드           :b2, after a2, 8d\n    section 배포\n    테스트           :c1, after b1, 3d\n    배포             :c2, after c1, 1d',
    pie: 'pie title 브라우저 점유율\n    "Chrome" : 65\n    "Safari" : 18\n    "Edge" : 10\n    "기타" : 7'
  };

  var codeInput = document.getElementById('codeInput');
  var preview = document.getElementById('diagramPreview');
  var currentPreset = 'flowchart';
  var renderSeq = 0;

  document.querySelectorAll('.preset-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentPreset = btn.dataset.preset;
      codeInput.value = PRESETS[currentPreset];
      render();
    });
  });

  var renderTimer = null;
  codeInput.addEventListener('input', function() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 400);
  });

  function render() {
    var code = codeInput.value.trim();
    if (!code) {
      preview.innerHTML = '<div class="diagram-empty">다이어그램이 여기에 표시됩니다</div>';
      return;
    }
    var seq = ++renderSeq;
    var id = 'bk-mermaid-' + Date.now();
    mermaid.render(id, code).then(function(result) {
      if (seq !== renderSeq) return;
      preview.innerHTML = result.svg;
      fitViewBox(preview.querySelector('svg'));
    }).catch(function(err) {
      if (seq !== renderSeq) return;
      var msg = (err && err.message) ? err.message : String(err);
      preview.innerHTML = '<div class="diagram-error">⚠️ 문법 오류가 있습니다:<br>' + escapeHtml(msg) + '</div>';
      var stray = document.getElementById(id);
      if (stray) stray.remove();
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Mermaid가 계산한 viewBox가 실제 렌더링된 내용(라벨/역방향 화살표 등)보다
  // 작아 하단/우측이 잘리는 경우가 있어, 렌더 직후 실제 bbox를 기준으로
  // 상하좌우 동일한 여백을 갖는 viewBox를 새로 만든다. (넘치는 쪽만 넓히면
  // 여백이 비대칭해져 다이어그램이 한쪽으로 치우쳐 보이는 문제가 있었음)
  function fitViewBox(svg) {
    if (!svg) return;
    var bbox;
    try { bbox = svg.getBBox(); } catch (e) { return; }
    if (!bbox || !isFinite(bbox.width) || !isFinite(bbox.height) || (bbox.width === 0 && bbox.height === 0)) return;

    var pad = 20;
    var left = bbox.x - pad, top = bbox.y - pad;
    var w = bbox.width + pad * 2, h = bbox.height + pad * 2;
    svg.setAttribute('viewBox', left + ' ' + top + ' ' + w + ' ' + h);
    if (svg.hasAttribute('width') && svg.getAttribute('width') !== '100%') svg.setAttribute('width', w);
    if (svg.hasAttribute('height') && svg.getAttribute('height') !== '100%') svg.setAttribute('height', h);
  }

  // ── SVG 다운로드 ──
  document.getElementById('downloadSvgBtn').addEventListener('click', function() {
    var svg = preview.querySelector('svg');
    if (!svg) { showToast('다운로드할 다이어그램이 없습니다'); return; }
    var svgData = new XMLSerializer().serializeToString(svg);
    var blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'diagram.svg';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('✓ SVG 파일이 저장됩니다');
  });

  // ── PNG 다운로드 ──
  document.getElementById('downloadPngBtn').addEventListener('click', function() {
    var svg = preview.querySelector('svg');
    if (!svg) { showToast('다운로드할 다이어그램이 없습니다'); return; }

    var svgClone = svg.cloneNode(true);
    // viewBox 크기(전체 다이어그램 좌표계)를 기준으로 삼는다 — svg.width/height는
    // CSS(max-width:100%)로 화면에 축소 렌더링된 크기라 이걸 그대로 쓰면
    // 실제보다 작고 흐릿한 PNG가 만들어진다.
    var vb = svg.getAttribute('viewBox');
    var vbParts = vb ? vb.split(/\s+/).map(parseFloat) : null;
    var w = vbParts && isFinite(vbParts[2]) ? vbParts[2] : (svg.width && svg.width.baseVal ? svg.width.baseVal.value : 800);
    var h = vbParts && isFinite(vbParts[3]) ? vbParts[3] : (svg.height && svg.height.baseVal ? svg.height.baseVal.value : 600);
    if (!w || !isFinite(w)) w = 800;
    if (!h || !isFinite(h)) h = 600;

    svgClone.setAttribute('width', w);
    svgClone.setAttribute('height', h);
    var svgData = new XMLSerializer().serializeToString(svgClone);
    var svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(svgBlob);

    var img = new Image();
    img.onload = function() {
      var scale = 2;
      var canvas = document.createElement('canvas');
      canvas.width = w * scale;
      canvas.height = h * scale;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale);
      try {
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob) {
          URL.revokeObjectURL(url);
          if (!blob) { showToast('PNG 변환 중 오류가 발생했습니다. SVG 다운로드를 이용해주세요.'); return; }
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'diagram.png';
          a.click();
          URL.revokeObjectURL(a.href);
          showToast('✓ PNG 파일이 저장됩니다');
        }, 'image/png');
      } catch (e) {
        URL.revokeObjectURL(url);
        showToast('PNG 변환 중 오류가 발생했습니다. SVG 다운로드를 이용해주세요.');
      }
    };
    img.onerror = function() {
      URL.revokeObjectURL(url);
      showToast('PNG 변환 중 오류가 발생했습니다');
    };
    img.src = url;
  });

  // ── 코드 복사 ──
  document.getElementById('copyCodeBtn').addEventListener('click', function() {
    var val = codeInput.value;
    if (!val.trim()) { showToast('복사할 코드가 없습니다'); return; }
    navigator.clipboard.writeText(val).then(function() {
      showToast('✓ Mermaid 코드가 복사되었습니다');
    });
  });

  // ── 초기화 ──
  document.getElementById('resetBtn').addEventListener('click', function() {
    codeInput.value = PRESETS[currentPreset];
    render();
  });

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  // ── 초기화 ──
  codeInput.value = PRESETS[currentPreset];
  render();
  </script>
</body>
</html>
